<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard</title>
  <script src="https://kit.fontawesome.com/da08280601.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="shared/css/design-tokens.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="job-detail.css" />
  <link rel="stylesheet" href="dashboard.css" />
  <link rel="stylesheet" href="dashboard-board.css" />
  <link rel="stylesheet" href="components/modal-shell.css" />
  <link rel="stylesheet" href="modals/proof-contacts-modal/proof-contacts-modal.css" />
  <link rel="stylesheet" href="modals/detail-edit-modal/detail-edit-modal.css" />
  <link rel="stylesheet" href="modals/duplicate-job-modal/duplicate-job-modal.css" />
  <link rel="stylesheet" href="modals/create-customer-modal/create-customer-modal.css" />
</head>

<body data-theme="titanium" class="dashboard-body">

  <!-- The shared sidebar injects itself as the first child of <body>
       (shared/components/sidebar-component.js) -->

  <!-- ── WORK AREA ─────────────────────────────────────────────── -->
  <main class="dashboard-main">

    <!-- Search + create actions -->
    <div class="dashboard-actions-row">
      <div class="dashboard-search">
        <i class="fa-regular fa-magnifying-glass"></i>
        <input type="text" id="dashboard-search" placeholder="Search customers &amp; jobs" autocomplete="off"
          name="dashboard-search" />
      </div>
      <div class="dashboard-create-actions">
        <button class="add-row" type="button" onclick="openCreateJob()">+ New Job</button>
        <button class="add-row" type="button" onclick="openCreateCustomer()">+ New Customer</button>
      </div>
    </div>

    <!-- ── BOARD ──────────────────────────────────────────────────
         Lanes are job statuses; cards are jobs sitting in them. Markup
         is generated in dashboard-jobs.js — see the implementation
         notes at the bottom of this file.
    ─────────────────────────────────────────────────────────────── -->
    <div class="dashboard-content">
      <div class="legend" id="dashboard-legend"></div>
      <div class="kanban" id="dashboard-board"></div>
    </div>

  </main>

  <!-- ── MODAL: Create New Job (modals/duplicate-job-modal, no Content step) ── -->
  <div data-include="modals/duplicate-job-modal/duplicate-job-modal.html"></div>

  <!-- ── MODAL: Create New Customer (modals/create-customer-modal) ── -->
  <div data-include="modals/create-customer-modal/create-customer-modal.html"></div>

  <!-- Toast -->
  <div class="toast" id="toast">Saved</div>

  <script>
    window.SIDEBAR_CONFIG = { activeItem: 'Dashboard' };
  </script>
  <script src="shared/components/sidebar-component.js"></script>
  <script src="dashboard-jobs.js"></script>
  <script src="dashboard-loader.js"></script>
  <script>
    // ── Deep link: ?open=createJob | createCustomer auto-opens a modal ──
    // Used by the "Create Jobs and Customers" index page. dashboard-loader.js
    // re-fires DOMContentLoaded once the modal includes/scripts are in, so
    // this listener (added before that happens) checks again once they're
    // actually available.
    document.addEventListener('DOMContentLoaded', function () {
      const action = new URLSearchParams(window.location.search).get('open');
      if (action === 'createJob' && typeof openCreateJob === 'function') {
        openCreateJob();
      } else if (action === 'createCustomer' && typeof openCreateCustomer === 'function') {
        openCreateCustomer();
      }
    });
  </script>
  <!-- ══ IMPLEMENTATION NOTES ═══════════════════════════════════════════
       Components
         Sidebar          → shared/components/sidebar-component.js (PL-shared)
         DashboardActions → .dashboard-actions-row markup · .dashboard-search /
                            .add-row styles (dashboard.css)
         JobBoard         → .kanban / .lane / .job-card markup, generated by
                            dashboard-jobs.js · styles in dashboard-board.css
                            (brought over from PL-JOBS-DASHBOARDS)
         CreateJobModal   → modals/duplicate-job-modal in its "create" mode
         CreateCustomerModal → modals/create-customer-modal

       Simulated with JS (becomes Angular state / bindings)
         · DASHBOARD_STATUSES is the lane list; DASH_JOBS is mock data. In
           Angular the board is @for over statuses, each with @for over that
           status's jobs — the card markup in dashCardHTML() is the template.
         · Empty lanes collapse to a rail and expand on click (dashToggleLane).
         · The search filters the board client-side.
  ═══════════════════════════════════════════════════════════════════ -->

</body>

</html>
