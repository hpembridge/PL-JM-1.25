<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Proof Contacts Modal</title>
  <script src="https://kit.fontawesome.com/da08280601.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="../../shared/css/design-tokens.css" />
  <link rel="stylesheet" href="../../job-detail.css" />
  <link rel="stylesheet" href="../../components/modal-shell.css" />
  <link rel="stylesheet" href="proof-contacts-modal.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap" rel="stylesheet" />
</head>

<body data-theme="titanium">
  <div class="modal-overlay" id="modal-proofContacts" onclick="handleOverlayClick(event, 'proofContacts')">
    <div class="modal-panel">
      <div class="modal-header">
        <span class="modal-title">Manage Job Contacts</span>
        <button class="icon-btn" onclick="closeModal('proofContacts')"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body jc-body">

        <!-- ── PROOFS ── -->
        <section class="jc-card" data-channel="proofs">
          <div class="jc-card-header">
            <div class="jc-card-header-row">
              <span class="jc-card-title">Proofs</span>
            </div>
          </div>

          <!-- Token field: selected addresses are chips, typing filters the
               droplist, Enter or click adds, Backspace removes the last one. -->
          <div class="jc-field" onclick="jcFocusInput('proofs')">
            <div class="jc-chips"></div>
            <div class="jc-input-wrap">
              <input class="jc-search" type="text" placeholder="Add a recipient…" autocomplete="off" name="jc-recipient"
                oninput="jcOnInput('proofs', this.value)" onkeydown="jcOnKeydown(event, 'proofs')"
                onfocus="jcOnInput('proofs', this.value)" />
              <div class="jc-dropdown hidden-section"></div>
            </div>
          </div>

          <div class="jc-card-footer">
            <span class="jc-count">0 ADDRESSES</span>
          </div>
        </section>

        <!-- ── INVOICES ── -->
        <section class="jc-card" data-channel="invoices">
          <div class="jc-card-header">
            <div class="jc-card-header-row">
              <span class="jc-card-title">Invoices</span>
            </div>
          </div>

          <!-- Token field: selected addresses are chips, typing filters the
               droplist, Enter or click adds, Backspace removes the last one. -->
          <div class="jc-field" onclick="jcFocusInput('invoices')">
            <div class="jc-chips"></div>
            <div class="jc-input-wrap">
              <input class="jc-search" type="text" placeholder="Add a recipient…" autocomplete="off" name="jc-recipient"
                oninput="jcOnInput('invoices', this.value)" onkeydown="jcOnKeydown(event, 'invoices')"
                onfocus="jcOnInput('invoices', this.value)" />
              <div class="jc-dropdown hidden-section"></div>
            </div>
          </div>

          <div class="jc-card-footer">
            <span class="jc-count">0 ADDRESSES</span>
          </div>
        </section>

        <!-- ── SHIPPING NOTIFICATIONS ── -->
        <section class="jc-card" data-channel="shipping">
          <div class="jc-card-header">
            <div class="jc-card-header-row">
              <span class="jc-card-title">Shipping Notifications</span>
            </div>
          </div>

          <!-- Token field: selected addresses are chips, typing filters the
               droplist, Enter or click adds, Backspace removes the last one. -->
          <div class="jc-field" onclick="jcFocusInput('shipping')">
            <div class="jc-chips"></div>
            <div class="jc-input-wrap">
              <input class="jc-search" type="text" placeholder="Add a recipient…" autocomplete="off" name="jc-recipient"
                oninput="jcOnInput('shipping', this.value)" onkeydown="jcOnKeydown(event, 'shipping')"
                onfocus="jcOnInput('shipping', this.value)" />
              <div class="jc-dropdown hidden-section"></div>
            </div>
          </div>

          <div class="jc-card-footer">
            <span class="jc-count">0 ADDRESSES</span>
          </div>
        </section>

      </div>
      <div class="modal-footer">
        <button class="btn-secondary" onclick="closeModal('proofContacts')">Cancel</button>
        <button class="btn-primary" onclick="saveModal('proofContacts')">Save</button>
      </div>
    </div>
  </div>

</body>

</html>
