<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Header</title>
    <link rel="stylesheet" href="../../shared/css/design-tokens.css" />
    <link rel="stylesheet" href="../../job-detail.css" />
    <link rel="stylesheet" href="job-header.css" />

    <script src="https://kit.fontawesome.com/da08280601.js" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap" rel="stylesheet" />

</head>

<body>
    <!-- ══ JobHeader: start ══ -->
    <div class="header-wrap">

        <!-- ── JobHeader / Bar: status (left) + job output actions (right) ── -->
        <div class="job-header-bar">

            <!-- JobStatus: current production status + latest milestone -->
            <div class="job-status">
                <p class="job-status__badge">
                    <span class="job-status__dot" aria-hidden="true"></span>
                    Bindery on Cart
                </p>
                <p class="job-status__detail type-body-sm">Approved for Production on 9/22/26</p>
            </div>

            <!-- JobOutputActions -->
            <div class="job-actions-right">
                <button class="btn-secondary" id="trello-btn" onclick="trelloAction()">
                    Send to Trello
                    <i class="fa-solid fa-arrow-up-right"></i>
                </button>

                <button class="btn-secondary" id="duplicate-job-btn" onclick="openDuplicateJob()">
                    <i class="fa-regular fa-copy"></i>
                    Duplicate
                </button>

                <!-- Simple print button: shown when no interior boards or future print items exist -->
                <button class="btn-primary" id="print-btn-simple" onclick="printTicket()">
                    <i class="fa-regular fa-print"></i>
                    Print Ticket
                </button>

                <!-- Split print button: shown when interior boards (or future items) are present -->
                <!-- PROTOTYPE: initPrintButton() in job-detail.js toggles simple vs split -->
                <div class="btn-split" id="print-btn-split">
                    <button class="btn-split-main" onclick="printTicket()">
                        <i class="fa-regular fa-print"></i>
                        Print Ticket
                    </button>
                    <button class="btn-split-caret" onclick="togglePrintMenu(event)" aria-label="More print options">
                        <i class="fa-solid fa-chevron-down"></i>
                    </button>
                    <div class="btn-split-menu" id="print-menu">
                        <button onclick="printItem('ticket')">
                            <i class="fa-regular fa-file"></i>
                            Ticket
                        </button>
                        <button onclick="printItem('board')">
                            <i class="fa-regular fa-ruler-triangle"></i>
                            Interior Board Sheet
                        </button>
                        <div class="menu-divider"></div>
                        <button onclick="printItem('all')">
                            <i class="fa-regular fa-copy"></i>
                            All
                        </button>
                    </div>
                </div>
            </div>
        </div><!-- /.job-header-bar -->

        <!-- ── JobHeader / Card ── -->
        <section class="job-header-card" aria-labelledby="job-title">

            <!-- JobHeader / Top: job number + description + edit -->
            <div class="job-header-top">
                <h5 class="job-title-row" id="job-title">
                    <span class="job-title-row__number">232323</span>
                    <span class="job-title-row__name" id="description">2018 Standard Menu Single Fold Jan 2018 Ws</span>
                </h5>
                <button class="icon-btn" title="Edit job information" aria-label="Edit job information" onclick="openModal('editJob')">
                    <i class="fa-regular fa-pen"></i>
                </button>
            </div>

            <!-- JobMeta: read-only job facts as label/value pairs (repeatable → @for in Angular) -->
            <dl class="meta-list">
                <div class="meta-item">
                    <dt class="meta-item__label">Job type</dt>
                    <dd class="meta-item__value">New Job</dd>
                </div>
                <div class="meta-item">
                    <dt class="meta-item__label">Production Type</dt>
                    <dd class="meta-item__value">Printing</dd>
                </div>
                <div class="meta-item">
                    <!-- Scheduling: link text changes with request state (Make request / In review / Action needed / Shipping date) -->
                    <dt class="meta-item__label">Scheduling</dt>
                    <dd class="meta-item__value">
                        <a class="meta-link" href="#">Make request <i class="fa-solid fa-arrow-up-right"></i></a>
                    </dd>
                </div>
                <div class="meta-item">
                    <dt class="meta-item__label">Time tracked</dt>
                    <dd class="meta-item__value">
                        <a class="meta-link" href="#">24 hours <i class="fa-solid fa-arrow-up-right"></i></a>
                    </dd>
                </div>
                <div class="meta-item">
                    <dt class="meta-item__label">Sales</dt>
                    <dd class="meta-item__value">
                        <span class="avatar avatar--sales" title="Sales rep">JP</span>
                    </dd>
                </div>
                <div class="meta-item">
                    <dt class="meta-item__label">Billing</dt>
                    <dd class="meta-item__value">
                        <span class="avatar avatar--billing" title="Billing contact">SC</span>
                    </dd>
                </div>
            </dl>

            <!-- JobHeader / Footer: job-info panels (left) + audit line (right) -->
            <div class="job-header-footer">
                <div class="job-actions">
                    <button class="btn-secondary" onclick="openModal('manageNotes')">
                        Notes
                    </button>
                    <button class="btn-secondary" onclick="openModal('proofContacts')">
                        Job Contacts
                    </button>
                    <button class="btn-secondary" id="statusPill" onclick="openModal('scanHistory')">
                        Activity Log
                    </button>
                    <button class="btn-secondary" onclick="openModal('billingDetails')">
                        Billing Details
                    </button>
                </div>
                <p class="job-meta type-body-sm">Last modified by Healey Pembridge on 3/03/25</p>
            </div>

        </section><!-- /.job-header-card -->
    </div><!-- /.header-wrap -->
    <!-- ══ JobHeader: end ══ -->
</body>

</html>
